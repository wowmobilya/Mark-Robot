<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW · فحص صفحات العمل</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eef2;color:#173547;font:16px Arial,sans-serif}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}select{font:inherit;padding:10px;border:1px solid #a9bbc7;border-radius:9px;background:white}p{margin:0;font-size:14px}iframe{display:block;width:390px;height:850px;border:1px solid #a9bbc7;margin:0 auto 20px;background:white;max-width:100%}label{display:flex;gap:7px;align-items:center}</style></head><body>
<header><h1>فحص صفحات العمل</h1><label>عرض الشاشة<select id="viewport"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="1280">1280 px</option></select></label><label>القسم<select id="section"><option value="invoices">الفواتير ومعاينة الهاتف</option><option value="settings">الإعدادات</option><option value="purchase-planner">مساعد الشراء</option><option value="purchase-followup">متابعة التوريد</option><option value="print-history">سجل الطباعة</option><option value="review-center">مركز المتابعة</option><option value="daily-tasks">المهام اليومية</option><option value="global-search">البحث الشامل</option><option value="package-labels">إتيكيت الطرود</option><option value="product-costs">كلفة المنتجات</option><option value="invoice-archive">أرشيف الفواتير</option><option value="manufacturing">بطاقات التصنيع</option><option value="material-library">مكتبة المواد والخامات</option><option value="cost-analysis">تحليل الكلفة والربح</option><option value="qa-print-history">اختبار print-history — بيانات اصطناعية</option><option value="qa-review-center">اختبار review-center — بيانات اصطناعية</option><option value="qa-daily-tasks">اختبار daily-tasks — بيانات اصطناعية</option><option value="qa-global-search">اختبار global-search — بيانات اصطناعية</option><option value="qa-purchase-followup">اختبار متابعة التوريد — بيانات اصطناعية</option><option value="qa-purchase-planner">اختبار purchase-planner — بيانات اصطناعية</option><option value="qa-package-labels">اختبار الإتيكيت — بيانات اصطناعية</option><option value="qa-product-costs">اختبار كلفة المنتج — بيانات اصطناعية</option><option value="qa-invoice-archive">اختبار الأرشيف — بيانات اصطناعية</option><option value="qa-material-library">اختبار مكتبة المواد — بيانات اصطناعية</option><option value="qa-manufacturing">اختبار التصنيع — بيانات اصطناعية</option><option value="qa-cost-analysis">اختبار الربح — بيانات اصطناعية</option></select></label><p>واجهة البرنامج الحقيقية ضمن عرض محدد؛ لا تُنشئ هذه الصفحة بيانات اختبار.</p></header>
<iframe id="app" title="واجهة WOW" src="../../#invoices"></iframe>
<script>const frame=document.getElementById('app');document.getElementById('viewport').addEventListener('change',event=>{frame.style.width=event.target.value+'px';});document.getElementById('section').addEventListener('change',event=>{const section=event.target.value;frame.src=section.startsWith('qa-')?'operations-207.html?section='+encodeURIComponent(section.slice(3)):'../../?qa-workspace='+encodeURIComponent(section)+'#'+section;});</script>
</body></html>
